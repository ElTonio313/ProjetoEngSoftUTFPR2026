<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="65%" stop-color="#C8E6C9"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Frame -->
  <rect width="120" height="120" x="4" y="4" rx="22" fill="url(#sky)" stroke="#1B5E20" stroke-width="6"/>
  <!-- Pantanal Sun -->
  <circle cx="92" cy="36" r="16" fill="#FFD54F" stroke="#F9A825" stroke-width="3"/>
  <!-- River / Wetland base -->
  <path d="M 8 92 Q 38 84 64 92 T 120 90 L 120 104 Q 120 120 104 120 L 24 120 Q 8 120 8 104 Z" fill="url(#water)"/>
  <!-- Aguape leaf -->
  <ellipse cx="32" cy="102" rx="14" ry="6" fill="#66BB6A"/>
  <circle cx="32" cy="97" r="4" fill="#AB47BC"/>
  <!-- Stylized Tuiuiu (Jabiru) -->
  <!-- Legs -->
  <line x1="60" y1="78" x2="58" y2="104" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="68" y1="78" x2="70" y2="104" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Body -->
  <ellipse cx="62" cy="68" rx="20" ry="13" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="2"/>
  <path d="M 46 66 Q 62 58 76 70" fill="none" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Red Collar -->
  <path d="M 67 52 L 77 52 L 78 60 L 66 60 Z" fill="#D32F2F"/>
  <!-- Black Neck & Head -->
  <path d="M 68 34 L 76 34 L 76 52 L 68 52 Z" fill="#263238"/>
  <circle cx="72" cy="32" r="7" fill="#263238"/>
  <!-- Eye -->
  <circle cx="74" cy="31" r="1.8" fill="#FFFFFF"/>
  <!-- Strong Beak -->
  <path d="M 78 29 L 104 33 L 78 36 Z" fill="#263238"/>
</svg>
